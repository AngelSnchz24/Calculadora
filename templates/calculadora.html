<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/style.css') }}">
    <title>Calculadora</title>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark w-100">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Mi Calculadora</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('calculadora') }}">Calculadora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://getbootstrap.com/">Bootstrap</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Más opciones
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="https://developer.mozilla.org/es/docs/Web/CSS">CSS</a></li>
                            <li><a class="dropdown-item" href="https://developer.mozilla.org/es/docs/Web/HTML">HTML</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="https://es.wikihow.com/usar-una-calculadora">Ayuda</a></li>
                        </ul>
                    </li>
                </ul>
                <!-- Barra de búsqueda -->
                <form class="d-flex ms-auto" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
                    <button style="margin: 10px; border-radius: 2px;" btn btn-outline-light" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>


    <div class="header">
        <p id="resultado">Resultado: </p>
    </div>

<fieldset>
    <form action="{{url_for('calculadora')}}" method="POST">
        <input type="text" name="pantalla" id="pantalla" readonly class="form-control mb-3" placeholder="0">
        <div>
            <input type="button" value="7" onclick="agregar('7')">
            <input type="button" value="8" onclick="agregar('8')">
            <input type="button" value="9" onclick="agregar('9')">
        </div>
        <div>
            <input type="button" value="4" onclick="agregar('4')">
            <input type="button" value="5" onclick="agregar('5')">
            <input type="button" value="6" onclick="agregar('6')">
        </div>
        <div>
            <input type="button" value="1" onclick="agregar('1')">
            <input type="button" value="2" onclick="agregar('2')">
            <input type="button" value="3" onclick="agregar('3')">
        </div>
        <div>
            <input type="button" value="0" onclick="agregar('0')">
            <input type="button" value="+" onclick="agregar('+')">
            <input type="button" value="-" onclick="agregar('-')">
        </div>
        <div>
            <input type="button" value="*" onclick="agregar('*')">
            <input type="button" value="/" onclick="agregar('/')">
            <input type="button" value="." onclick="agregar('.')">
        </div>
        <div>
            <input type="button" value="=" onclick="calcular()">
            <input type="button" value="D" onclick="retroceder()">
            <input type="button" value="C" onclick="limpiar()">
        </div>
    </form>
</fieldset>
    </div>

    <script src="{{ url_for('static', filename='js/pantalla.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
